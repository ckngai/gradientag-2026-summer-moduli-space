name: Update last updated date

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Update README date
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          today = datetime.now(timezone.utc).strftime("%Y %B %d")
          updated, count = re.subn(
              r"\(Last updated: [^)]+\)(\s*<!-- LAST_UPDATED -->)",
              f"(Last updated: {today})\\1",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find the README last-updated marker")
          if updated != text:
              path.write_text(updated, encoding="utf-8")

      - name: Commit date change
        run: |
          if git diff --quiet -- README.md; then
            echo "Last-updated date is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update last updated date [skip ci]"
          git push
